services:
  auth-service:
    build: ./services/auth-service
    ports:
      - "8081:8081"
    env_file: .env
    environment:
      - SERVICE_PORT=8081
      - PYTHONUNBUFFERED=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8081 --workers 2
    networks:
      - verbex-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  agent-service:
    build: ./services/agent-service
    ports:
      - "8082:8082"
    env_file: .env
    environment:
      - SERVICE_PORT=8082
      - PYTHONUNBUFFERED=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8082 --workers 2
    depends_on:
      auth-service:
        condition: service_healthy
    networks:
      - verbex-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  chat-service:
    build: ./services/chat-service
    ports:
      - "8083:8083"
    env_file: .env
    environment:
      - SERVICE_PORT=8083
      - PYTHONUNBUFFERED=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8083 --workers 2
    depends_on:
      auth-service:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    networks:
      - verbex-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_AUTH_URL=http://auth-service:8081
      - NEXT_PUBLIC_AGENT_URL=http://agent-service:8082
      - NEXT_PUBLIC_CHAT_URL=http://chat-service:8083
    depends_on:
      auth-service:
        condition: service_healthy
      agent-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    networks:
      - verbex-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

networks:
  verbex-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
